# Spoolman connection, from the OpenCreator Spoolman plugin.
#
# The plugin copied this file to the printer's config folder and added
# [include oc-spoolman.conf] to moonraker.conf. This copy is yours: plugin updates
# don't touch it.
#
# 1. Put your Spoolman server's address on the server: line, the same address you
#    open Spoolman with in a browser, port included (Spoolman's default is 7912).
# 2. Remove the # in front of the three lines below.
# 3. Save, restart Moonraker, then run FIRMWARE_RESTART so AFC sees Spoolman.

#[spoolman]
#server: http://192.168.1.100:7912
#sync_rate: 5
